<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>Renzu character</title>
  <desc>A cyan chameleon facing right, with an attentive eye and a curled tail.</desc>
  <style>
  @keyframes renzu-breathe{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(-1deg)}}
  @keyframes renzu-blink{0%,40%,44%,100%{transform:scaleY(1)}42%{transform:scaleY(.08)}}
  .renzu-character{transform-origin:256px 270px;animation:renzu-breathe 6s ease-in-out infinite}
  .renzu-eye{transform-origin:337px 229px;animation:renzu-blink 7s ease-in-out infinite}
  @media(prefers-reduced-motion:reduce){.renzu-character,.renzu-eye{animation:none}}
